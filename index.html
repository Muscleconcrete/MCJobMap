// ===== Customer mood =====
const MOODS={
  5:{e:'😊',label:'Happy',hex:'#2eb673'},
  4:{e:'🙂',label:'Good',hex:'#2eb673'},
  3:{e:'😐',label:'Neutral',hex:'#96999c'},
  2:{e:'😕',label:'Frustrated',hex:'#f0d020'},
  1:{e:'😠',label:'At risk',hex:'#e05445'},
};
function parseMood(v){
  const s=String(v||'').trim().toLowerCase();
  if(!s) return null;
  if(/^[1-5]$/.test(s)) return +s;
  if(/happy|great|love/.test(s)) return 5;
  if(/^good|satisfied|fine/.test(s)) return 4;
  if(/neutral|ok/.test(s)) return 3;
  if(/frustrat|annoyed|impatient|unhappy/.test(s)) return 2;
  if(/at risk|angry|upset|furious|hostile/.test(s)) return 1;
  return null;
}
function noteFlags(note){
  const n=String(note||'').toLowerCase(), out=[];
  const m=/(disput\w*|refund\w*|angry|upset|lawyer\w*|charge ?back|threat\w*|bbb|frustrat\w*|complaint\w*)/.exec(n);
  if(m) out.push({e:'⚠',label:'Check in — note flag',hex:'#f0d020',word:m[1]});
  if(/does ?n.?t (respond|answer)|no response|not respond|won.?t answer|ghost/.test(n)) out.push({e:'👻',label:'Not responding',hex:'#96999c'});
  return out;
}

// ===== SCHEDULING INTELLIGENCE ==========================================================
// Encodes Muscle Concrete's field rules: 2-day prep+pour windows, ground drying model,
// P-job open-footer logic, overnight-rain rules, late-day pour starts, temp gates.
function siteOffset(hourly){
  try{ return hourly.properties.periods[0].startTime.slice(19)||'-05:00'; }catch(e){ return '-05:00'; }
}
function gridSeries(grid,prop){
  const vals=grid&&grid.properties&&grid.properties[prop]&&grid.properties[prop].values||[];
  return vals.map(v=>{ const [iso,dur]=v.validTime.split('/');
    return {start:new Date(iso),hours:durHours(dur),value:v.value}; });
}
function seriesAvg(series,from,to){
  let tot=0,w=0;
  for(const s of series){ if(s.value==null) continue;
    const e=new Date(s.start.getTime()+s.hours*3600e3);
    const a=Math.max(from,s.start),b=Math.min(to,e);
    if(b>a){ tot+=s.value*(b-a); w+=(b-a); } }
  return w?tot/w:null;
}
function analyzeWx(c,daily,hourly,grid,pastRain,ext,om){
  const qpf=buildQpf(grid), hasQpf=qpf.length>0;
  const off=siteOffset(hourly), periods=(hourly.properties.periods||[]);
  const sky=gridSeries(grid,'skyCover');
  // build day list (site-local)
  const keys=[]; periods.forEach(p=>{ const k=p.startTime.slice(0,10); if(!keys.includes(k)) keys.push(k); });
  const days=keys.slice(0,7).map(k=>{
    const d0=new Date(k+'T00:00:00'+off), d24=new Date(d0.getTime()+24*3600e3);
    const slots=periods.filter(p=>p.startTime.slice(0,10)===k);
    const temps=slots.map(s=>s.temperature);
    const hi=temps.length?Math.max(...temps):null, lo=temps.length?Math.min(...temps):null;
    const popMax=Math.max(0,...slots.map(s=>(s.probabilityOfPrecipitation&&s.probabilityOfPrecipitation.value)||0));
    const amt=hasQpf?qpfBetween(qpf,d0,d24):0;
    const morn=hasQpf?qpfBetween(qpf,d0,new Date(d0.getTime()+14*3600e3)):0; // midnight–2pm: rain here soaks a pour morning
    // when does meaningful rain start? (site-local hour)
    let rainStart=null;
    for(const s of slots){ const pop=(s.probabilityOfPrecipitation&&s.probabilityOfPrecipitation.value)||0;
      const hr=+s.startTime.slice(11,13);
      const hAmt=hasQpf?qpfBetween(qpf,new Date(s.startTime),new Date(s.endTime)):0;
      if(pop>=50&&(hAmt>=0.02||morn+amt>=0.15)){ rainStart=hr; break; } }
    const skyAvg=seriesAvg(sky,new Date(d0.getTime()+9*3600e3),new Date(d0.getTime()+17*3600e3));
    // overnight into NEXT day: 18:00 -> +1d 10:00
    const oNight=hasQpf?qpfBetween(qpf,new Date(d0.getTime()+18*3600e3),new Date(d0.getTime()+34*3600e3)):0;
    return {key:k,d0,hi,lo,amt,morn,rainStart,skyAvg,oNight,popMax,
      dow:new Date(k+'T12:00:00').toLocaleDateString([],{weekday:'short'})};
  });
  // same-day dispatch never happens: today is context, not a schedulable day
  let droppedToday=null;
  if(days.length>1) droppedToday=days.shift();
  // Two horizons on the Sunday boundary (weeks run Sun–Sat):
  //   current week  = today through the upcoming Sunday
  //   New Schedule  = that Sunday through the following Saturday
  let modeNote=null;
  {
    let sun=-1;
    for(let i=0;i<days.length;i++){ if(days[i].dow==='Sun'){ sun=i; break; } }
    if(typeof NEXT_MODE!=='undefined'&&NEXT_MODE){
      if(sun>=0){
        days.splice(0,sun);
        if(days.length>7) days.length=7;
        if(days.length<3) modeNote='Detailed forecast only reaches '+days.map(d=>d.dow).join('/')+' of the new week — later days firm up daily; lean on the outlook line.';
        else if(days.length<6) modeNote='Detailed forecast covers '+days.map(d=>d.dow).join('/')+' of the new week so far — the back half firms up daily.';
      } else {
        modeNote='The new week (Sun–Sat) is beyond today\'s detailed forecast — use the outlook line and re-check in a day or two.';
      }
    } else {
      if(sun>=0&&sun<days.length-1) days.length=sun+1; // current week ends Sunday
      if(days.length<3) modeNote='Week\'s wrapping up — flip to New Schedule for the Sun–Sat plan.';
    }
  }
  // second opinion: MET Norway (European model, same family Apple Weather uses).
  // When it shows meaningfully MORE rain than NWS for a day, grade on the wetter source —
  // a crew only rolls when both models agree it's dry.
  let mdShared=null;
  if(ext&&ext.length){ try{ mdShared=metnoDaily(ext,off); }catch(e){} }
  let euroLive=false;
  if(mdShared){
    days.forEach(d=>{
      const m=mdShared[d.key]; if(!m) return;
      euroLive=true;
      const mMorn=(m.hours||[]).filter(x=>x.h<14).reduce((t,x)=>t+x.amt,0);
      if(Math.abs(m.amt-d.amt)>=0.2) d.split={nws:d.amt,euro:m.amt};
      d.amt=Math.max(d.amt,m.amt);            // always the wetter source
      d.morn=Math.max(d.morn,mMorn);
      if(d.rainStart==null){
        const fh=(m.hours||[]).slice().sort((a,b)=>a.h-b.h).find(x=>x.amt>=0.02);
        if(fh) d.rainStart=fh.h;
      }
    });
  }
  // data-health: NWS amounts missing while its own rain chances are high = broken feed, not dry skies
  const qpfBroken=days.some(d=>d.popMax>=55&&d.amt<0.08&&!(mdShared&&mdShared[d.key]));
  const dataNote=(!euroLive&&qpfBroken)?'⚠ Rain amounts unavailable from both sources — graded on rain CHANCES only; verify manually.'
    :(!euroLive?'Euro model unreachable — NWS only this load.':null);
  // extend beyond NWS with MET Norway estimate days (marked est:true)
  if(ext&&ext.length){
    try{
      const md=mdShared||metnoDaily(ext,off);
      const have=new Set(days.map(d=>d.key));
      const allKeys=Object.keys(md).sort();
      for(const k of allKeys){
        if(have.has(k)) continue;
        if(days.length>=11) break;
        if(k<=days[days.length-1].key) continue;
        const m=md[k];
        if(m.hi==null) continue;
        let rainStart=null;
        for(const hh of m.hours.sort((a,b)=>a.h-b.h)){ if(hh.amt>=0.02){ rainStart=hh.h; break; } }
        const oNight=m.hours.filter(x=>x.h>=18).reduce((t,x)=>t+x.amt,0);
        days.push({key:k,d0:new Date(k+'T00:00:00'+off),hi:Math.round(m.hi),lo:Math.round(m.lo),
          amt:m.amt,morn:m.morn,rainStart,skyAvg:m.skyN?m.skySum/m.skyN:null,oNight,est:true,
          dow:new Date(k+'T12:00:00').toLocaleDateString([],{weekday:'short'})});
      }
    }catch(e){}
  }
  // third opinion: Open-Meteo model blend. Same rule as the Euro layer — grade every day on
  // the WETTEST source, and fold its probability in so high-chance days can't read as open.
  if(om){
    days.forEach(d=>{
      const m=om[d.key]; if(!m) return;
      if(m.pop!=null) d.popMax=Math.max(d.popMax||0,m.pop);
      if(m.amt-d.amt>=0.15) d.split2={a:d.amt,b:m.amt};
      d.amt=Math.max(d.amt,m.amt);
    });
  }
  // freeze check: min temp from this day 18:00 through next day 09:00
  days.forEach((d,i)=>{
    const nxt=days[i+1];
    d.nightLo=d.lo;
    if(nxt!=null&&nxt.lo!=null&&d.lo!=null) d.nightLo=Math.min(d.lo,nxt.lo);
  });
  // drying power per day
  const dryPower=d=>{
    if(d.amt>=0.15) return 0.05;
    let D;
    const s=d.skyAvg==null?55:d.skyAvg;
    if(s<45&&d.hi>=80) D=0.6; else if(s<45) D=0.4; else if(s<=70) D=0.28; else D=0.15;
    if(d.hi!=null&&d.hi<50) D*=0.5;
    if(d.hi!=null&&d.hi>=90) D+=0.08;
    return D;
  };
  // seed wetness from observed past rain (most recent counts most)
  let W=0;
  if(pastRain&&pastRain.daily&&pastRain.daily.length){
    for(const day of pastRain.daily){ W+=day.in; W=Math.max(0,W-0.3); }
  }
  if(droppedToday){ W+=droppedToday.amt; W=Math.max(0,W-dryPower(droppedToday)); }
  // walk forward: grade each day, then apply its rain + drying
  days.forEach(d=>{
    const eff=Math.max(0,W-0.5*dryPower(d));
    d.wet=eff; // ground state entering/during the day
    let g,why=[];
    if(d.nightLo!=null&&d.nightLo<=32){ g='freeze'; why.push('freeze risk overnight ('+d.nightLo+'°)'); }
    else if(d.hi!=null&&d.hi<38){ g='freeze'; why.push('too cold ('+d.hi+'° high)'); }
    else if(d.amt>=0.4){ g='rain'; why.push(fmtIn(d.amt)+' rain — too much even late-day'); }
    else if(d.morn>=0.1||(d.amt>=0.2&&(d.rainStart==null||d.rainStart<15))){ g='rain'; why.push(fmtIn(d.amt)+' rain'); }
    else if(d.popMax!=null&&d.popMax>=70&&d.amt>=0.1){ g='rain'; why.push(d.popMax+'% rain chance, ~'+fmtIn(d.amt)); }
    else if(d.amt>=0.08&&d.rainStart!=null&&d.rainStart>=15){ g='early'; why.push('rain in around '+(d.rainStart%12||12)+'pm — start early'); }
    else if(d.amt<0.1&&d.popMax>=60){ g='marginal'; why.push(d.popMax+'% rain chance — amounts unclear, treat cautious'); }
    else if(eff>0.7){ g='wet'; why.push('ground too wet'); }
    else if(d.popMax!=null&&d.popMax>=55&&d.amt>=0.04){ g='marginal'; why.push(d.popMax+'% rain chance — watch it'); }
    else if(eff>0.25){ g='marginal'; why.push('ground still drying'); }
    else { g='good'; if(d.amt>0&&d.amt<0.08) why.push('light sprinkle possible — workable'); }
    if(g==='good'&&d.hi!=null&&d.hi>=95){ g='heat'; why.push(d.hi+'° — early start only'); }
    d.grade=g; d.why=why;
    W+=d.amt; W=Math.max(0,W-dryPower(d));
  });
  const pourOK=d=>d.dow!=='Sun'; // no Sunday pours, ever
  const satTag=d=>d.dow==='Sat'?' (Sat — plant availability?)':'';
  const pourable=d=>['good','early','heat'].includes(d.grade)&&pourOK(d);
  const marginalOk=d=>(pourable(d)||(d.grade==='marginal'&&pourOK(d)));
  // window search
  let windowTxt=null, cls='ok', chip='';
  if(!days.length){
    return {chip:'NEXT WEEK — NO DATA YET',cls:'warn',
      text:modeNote||'Beyond detailed forecast range.',ctx:'',prefix:(STATUS[c.status]?STATUS[c.status].label:''),days:[]};
  }
  if(c.status==='repair'){
    // repairs: 1-day, tolerate more rain, no plant dependency (any day works)
    const repairOK=d=>{
      if(d.nightLo!=null&&d.nightLo<=30) return false;      // slightly looser cold gate
      if(d.morn>=0.2) return false;                          // tolerates light morning rain
      if(d.amt>=0.4&&(d.rainStart==null||d.rainStart<15)) return false;
      if(d.wet>0.95) return false;                           // only truly soaked ground blocks
      return true;
    };
    const okAll=days.filter(repairOK);
    if(!okAll.length){ chip='NO REPAIR DAY'; cls='bad';
      windowTxt='Nothing workable in this stretch — heavy rain pattern.'; }
    else{
      cls='ok';
      if(okAll.length>=days.length-1){
        chip='REPAIR — OPEN WEEK';
        windowTxt='Repair (1-day, rain-tolerant): any day '+okAll[0].dow+'–'+okAll[okAll.length-1].dow+(days.some(d=>d.est)?'~':'')+' works.';
      } else {
        chip='REPAIR '+okAll[0].dow.toUpperCase();
        const idx=okAll.map(d=>days.indexOf(d));
        const runs=[]; let cur=null;
        for(const i of idx){
          if(cur&&i===cur.b+1) cur.b=i;
          else { if(cur) runs.push(cur); cur={a:i,b:i}; }
        }
        if(cur) runs.push(cur);
        const lbl=r=>{
          const est=days.slice(r.a,r.b+1).some(d=>d.est)?'~':'';
          return r.b>r.a?days[r.a].dow+'–'+days[r.b].dow+est:days[r.a].dow+est;
        };
        windowTxt='Repair (1-day, rain-tolerant): '+runs.slice(0,4).map(lbl).join(' · ')+'.';
      }
    }
  } else if(c.mark==='P'){
    // 1-day pour; trailing-rain footer check
    const past3=(pastRain&&pastRain.last3!=null)?pastRain.last3:null;
    let idx=days.findIndex(pourable);
    let idxM=days.findIndex(marginalOk);
    if(idx<0&&idxM>=0) idx=idxM;
    let footerLine=null, plan2=false;
    if(idx>=0){
      let lead=days.slice(0,idx).reduce((t,d)=>t+d.amt,0);
      if(past3!=null) lead+=past3;
      if(past3==null&&c.prep) footerLine='rain history unavailable — verify footers before dispatch';
      else if(lead>=0.75){ footerLine='footer cleanup likely ('+fmtIn(lead)+' recent rain) — plan 2 days'; plan2=true; }
      else if(lead>=0.3) footerLine='inspect footers first ('+fmtIn(lead)+' recent rain)';
    }
    const openDays=c.prepDays;
    let ageLine=null;
    if(openDays!=null&&openDays>7){
      ageLine='footers open '+openDays+' days'+(pastRain&&pastRain.sincePrep!=null?', ~'+fmtIn(pastRain.sincePrep)+' rain since prep':'')+' — verify before dispatching';
    }
    if(idx<0){ chip='NO POUR WINDOW'; cls='bad'; windowTxt='No pourable day in the next 7 — '+(days[0]?days.map(d=>d.dow+': '+d.grade).slice(0,4).join(', '):''); }
    else{
      const d=days[idx];
      const allPour=days.filter(x=>pourable(x)).slice(0,3);
      // beat-the-storm: big rain within 2 days after the window
      const storm=days.slice(idx+1,idx+3).find(x=>x.amt>=0.5);
      chip='POUR '+d.dow.toUpperCase(); cls=plan2||ageLine?'warn':'ok';
      windowTxt='Pour days: '+(allPour.length?allPour.map(x=>x.dow+(x.est?'~':'')+satTag(x)+(x.grade==='early'?' (early start)':'')).join(' · '):d.dow)+'.';
      if(storm) windowTxt+=' '+fmtIn(storm.amt)+' coming '+storm.dow+' — pour before it or plan footer cleanup after.';
      if(footerLine) windowTxt+=' '+cap(footerLine)+'.';
      if(ageLine){ windowTxt+=' '+cap(ageLine)+'.'; }
    }
  } else {
    // standard 2-day: collect ALL prep+pour pairs in the horizon
    // every day that can be POURED (with a valid prep day before it) — solid or marginal
    const pd=[];
    for(let i=1;i<days.length;i++){
      const p=days[i-1], q=days[i];
      const prepOk=p.grade!=='freeze'&&p.grade!=='rain'&&p.grade!=='wet'
        &&(p.amt<0.2||(p.rainStart!=null&&p.rainStart>=15));
      if(!prepOk) continue;
      if(pourable(q)&&p.amt<0.2&&p.oNight<0.2) pd.push({i,t:false});
      else if(marginalOk(q)&&p.amt<0.35&&p.oNight<0.4) pd.push({i,t:true});
    }
    if(!pd.length){ chip='NO WINDOW THIS WEEK'; cls='bad';
      windowTxt='No clean prep+pour pair in this stretch: '+days.slice(0,5).map(d=>d.dow+' '+(d.grade==='good'?'✓':d.grade)).join(', ')+'.';
    } else {
      const firstSolid=pd.find(w=>!w.t)||pd[0];
      const p0=days[firstSolid.i-1];
      chip=(firstSolid.t?'TIGHT FIT — ':'')+p0.dow.toUpperCase()+' PREP / '+days[firstSolid.i].dow.toUpperCase()+' POUR';
      cls=firstSolid.t?'warn':'ok';
      if(pd.length>=days.length-2&&pd.every(w=>!w.t)){
        const hasSat=pd.some(w=>days[w.i].dow==='Sat');
        chip='OPEN WEEK'+(days.some(d=>d.est)?'~':'');
        windowTxt='Wide open — pour any day '+days[pd[0].i].dow+'–'+days[pd[pd.length-1].i].dow+
          (days.some(d=>d.est)?'~':'')+(hasSat?' (Sat: plant?)':'')+'.';
      } else {
        // merge ALL consecutive pour days (solid + marginal) into ranges; marginal flagged inline
        const runs=[]; let cur=null;
        for(const w of pd){
          if(cur&&w.i===cur.b+1){ cur.b=w.i; if(w.t) cur.tights.push(days[w.i].dow); }
          else { if(cur) runs.push(cur); cur={a:w.i,b:w.i,tights:w.t?[days[w.i].dow]:[]}; }
        }
        if(cur) runs.push(cur);
        const lbl=r=>{
          const est=days.slice(r.a-1,r.b+1).some(d=>d.est)?'~':'';
          const satIn=days.slice(r.a,r.b+1).some(d=>d.dow==='Sat');
          const tight=r.tights.length?' ('+r.tights.join('/')+'* marginal)':'';
          if(r.b>r.a) return 'pour '+days[r.a].dow+'–'+days[r.b].dow+est+tight+(satIn?' (Sat: plant?)':'');
          const q=days[r.a];
          return days[r.a-1].dow+'/'+q.dow+est+(r.tights.length?'*':'')+satTag(q)+(q.grade==='early'?' (early start)':'');
        };
        windowTxt='Windows: '+runs.slice(0,4).map(lbl).join(' · ')+'.'+(runs.some(r=>r.tights.length)?' *=marginal ground.':'');
        // chip carries the first RANGE, not just the first pair
        const fr=runs[0];
        if(fr&&fr.b>fr.a){
          const est=days.slice(fr.a-1,fr.b+1).some(d=>d.est)?'~':'';
          chip='POUR '+days[fr.a].dow.toUpperCase()+'–'+days[fr.b].dow.toUpperCase()+est;
          cls=(fr.tights.length>=(fr.b-fr.a+1))?'warn':'ok';
        }
      }
      if(p0.oNight>=0.2&&p0.oNight<0.4) windowTxt+=' Watch overnight rain into the first pour.';
    }
    if(days.some(d=>d.grade==='freeze')){ if(cls==='bad'){cls='cold';chip='TOO COLD';} }
  }
  // context lines
  const ctx=[];
  const rainDays=days.filter(d=>d.amt>=0.25).slice(0,2);
  rainDays.forEach(d=>ctx.push(fmtIn(d.amt)+' '+d.dow));
  const wetD=days.find(d=>d.grade==='wet'||d.grade==='marginal');
  if(wetD&&wetD.why.length) ctx.push(wetD.dow+': '+wetD.why[0]);
  const sp=days.find(d=>d.split);
  if(sp) ctx.push(sp.dow+': models split (NWS '+fmtIn(sp.split.nws)+' vs Euro '+fmtIn(sp.split.euro)+') — graded on the wetter side');
  const sp2=days.find(d=>d.split2&&!d.split);
  if(sp2&&!sp) ctx.push(sp2.dow+': model blend shows '+fmtIn(sp2.split2.b)+' vs NWS '+fmtIn(sp2.split2.a)+' — graded on the wetter side');
  const s=STATUS[c.status];
  let prefix=(s?s.label:'')+(c.company&&c.company!=='Muscle Concrete'?' · '+c.company:'');
  if(c.status==='notready') chip='WHEN READY: '+chip;
  if(c.mood!=null&&c.mood<=2&&windowTxt) windowTxt+=' Customer running hot — bump priority.';
  if(c.readyDays!=null&&c.readyDays>=14&&['inhouse','jrcrew','both'].includes(c.status)&&windowTxt)
    windowTxt+=' Ready '+c.readyDays+' days without a slot — prioritize.';
  if(days.some(d=>d.est)&&windowTxt&&/~/.test(windowTxt)) windowTxt+=' ~ = extended model estimate (MET Norway), roughly 60–70% reliable at that range — pencil it, confirm as the day firms.';
  if(typeof dataNote!=='undefined'&&dataNote) windowTxt=(windowTxt?windowTxt+' ':'')+dataNote;
  if(modeNote) windowTxt=(windowTxt?windowTxt+' ':'')+modeNote;
  if(typeof NEXT_MODE!=='undefined'&&NEXT_MODE&&!days.length){ chip='NEXT WEEK — NO DATA YET'; cls='warn'; }
  return {chip:(typeof NEXT_MODE!=='undefined'&&NEXT_MODE&&days.length?'NEXT WK: ':'')+chip,cls,text:windowTxt,ctx:ctx.slice(0,2).join(' · '),prefix,days};
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
// extended DETAIL forecast: MET Norway (free, commercial OK w/ attribution) reaches ~9-10 days,
// used only for days beyond NWS coverage and always marked as estimates
// third opinion: Open-Meteo "best match" model blend — daily rain totals AND rain probability.
// Free, no key. Grade on the wettest source; fold its probability into popMax.
async function fetchOpenMeteo(lat,lng){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat.toFixed(4)+'&longitude='+lng.toFixed(4)+
      '&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min'+
      '&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=auto&forecast_days=10');
    if(!r.ok) return null;
    const j=await r.json(); const d=j.daily;
    if(!d||!d.time) return null;
    const out={};
    d.time.forEach((k,i)=>out[k]={
      amt:(d.precipitation_sum&&d.precipitation_sum[i])||0,
      pop:d.precipitation_probability_max?d.precipitation_probability_max[i]:null});
    return out;
  }catch(e){ return null; }
}
async function fetchMetNo(lat,lng){
  for(const u of ['https://api.met.no/weatherapi/locationforecast/2.0/compact?lat='+lat.toFixed(4)+'&lon='+lng.toFixed(4),
                  '/api/metno?lat='+lat.toFixed(4)+'&lng='+lng.toFixed(4)]){
    try{
      const r=await fetch(u);
      if(!r.ok) continue;
      const j=await r.json();
      const ts=(j.properties&&j.properties.timeseries)||null;
      if(ts&&ts.length) return ts;
    }catch(e){}
  }
  return null;
}
function metnoDaily(ts,off){ // -> {key:{amt,morn,hi,lo,skySum,skyN,hours:[{h,amt}]}}
  const offMin=(off[0]==='-'?-1:1)*(+off.slice(1,3)*60+ +off.slice(4,6));
  const out={};
  for(const e of ts){
    const t=new Date(e.time);
    const local=new Date(t.getTime()+offMin*60e3);
    const key=local.toISOString().slice(0,10);
    const h=local.getUTCHours();
    const d=(out[key]=out[key]||{amt:0,morn:0,hi:null,lo:null,skySum:0,skyN:0,hours:[]});
    const inst=e.data&&e.data.instant&&e.data.instant.details||{};
    if(inst.air_temperature!=null){
      const f=inst.air_temperature*9/5+32;
      d.hi=d.hi==null?f:Math.max(d.hi,f); d.lo=d.lo==null?f:Math.min(d.lo,f);
    }
    if(inst.cloud_area_fraction!=null){ d.skySum+=inst.cloud_area_fraction; d.skyN++; }
    let mm=null;
    if(e.data&&e.data.next_1_hours&&e.data.next_1_hours.details) mm=e.data.next_1_hours.details.precipitation_amount;
    else if(e.data&&e.data.next_6_hours&&e.data.next_6_hours.details) mm=e.data.next_6_hours.details.precipitation_amount;
    if(mm!=null){
      const inches=mm/25.4;
      d.amt+=inches;
      if(h<14) d.morn+=inches;
      d.hours.push({h,amt:inches});
    }
  }
  return out;
}
// extended outlook: NOAA CPC 6-10 & 8-14 day, precip (layer 1) + temperature (layer 0),
// with strength-tiered language instead of generic "tight"
async function fetchOutlook(lat,lng){
  const q=(svc,layer)=>fetch('https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/'+svc+
    '/MapServer/'+layer+'/query?geometry='+lng.toFixed(3)+','+lat.toFixed(3)+
    '&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=false&f=json')
    .then(r=>r.json()).catch(()=>null);
  const read=(j)=>{
    try{
      const a=j&&j.features&&j.features[0]&&j.features[0].attributes;
      if(!a) return null;
      let cat=null,prob=null;
      for(const k of Object.keys(a)){
        if(/cat/i.test(k)&&typeof a[k]==='string') cat=a[k];
        if(/prob/i.test(k)&&isFinite(a[k])) prob=Math.round(a[k]);
      }
      return cat?{cat,prob}:null;
    }catch(e){ return null; }
  };
  const dir=o=>o?(/above/i.test(o.cat)?1:/below/i.test(o.cat)?-1:0):0;
  const strength=p=>p==null?'':p>=60?'heavy ':p>=50?'strong ':p>=40?'':'slight ';
  try{
    const [p610,t610,p814]=await Promise.all([
      q('cpc_6_10_day_outlk',1), q('cpc_6_10_day_outlk',0), q('cpc_8_14_day_outlk',1)
    ]);
    const oP=read(p610), oT=read(t610), oP2=read(p814);
    if(!oP&&!oP2) return null;
    const pieces=[];
    if(oP){
      const d=dir(oP);
      if(d===0||((oP.prob||0)<36)) pieces.push('days 6–10: no strong rain signal — plan on typical conditions');
      else pieces.push('days 6–10: '+strength(oP.prob)+'lean '+(d>0?'wetter':'drier')+' ('+(oP.prob||'?')+'%)');
    }
    if(oP2){
      const d=dir(oP2), same=oP&&dir(oP)===d&&d!==0;
      if(d!==0&&(oP2.prob||0)>=36) pieces.push('days 8–14 '+(same?'stay ':'')+strength(oP2.prob)+(d>0?'wetter':'drier')+' ('+(oP2.prob||'?')+'%)');
    }
    // temperature colors the drying implication
    const tD=dir(oT), pD=oP?dir(oP):0, pStrong=(oP&&(oP.prob||0)>=40);
    let advice='';
    if(pD>0&&pStrong&&tD>0) advice='Rainier but warm — expect quick drying between systems; windows will exist but move fast.';
    else if(pD>0&&pStrong&&tD<0) advice='Wet and cool — ground will hold water; lock this week\'s windows, expect scarce ones after.';
    else if(pD>0&&pStrong) advice='Book the near windows; week-after looks tighter.';
    else if(pD<0&&pStrong&&tD>0) advice='Dry and warm — prime scheduling stretch, safe to book further out.';
    else if(pD<0&&pStrong) advice='Leaning dry — good odds scheduling out.';
    else advice='Weak signal either way — schedule off this week\'s detail, re-check Wednesday.';
    let p814txt=null;
    if(oP2){ const d2=dir(oP2);
      p814txt=(d2!==0&&(oP2.prob||0)>=36)?strength(oP2.prob)+'lean '+(d2>0?'wetter':'drier')+' ('+(oP2.prob||'?')+'%).':'no strong lean either way.'; }
    return {text:'Further out: '+pieces.join('; ')+'. '+advice, p814txt};
  }catch(e){ return null; }
}
// compose the Further-out line: concrete forecast rain outranks the anomaly outlook
function composeFurtherOut(a,outlook){
  try{
    const tail=(a&&a.days||[]).filter((d,i)=>i>=3);
    const tailRain=tail.reduce((t,d)=>t+(d.amt||0),0);
    const rainDays=tail.filter(d=>d.amt>=0.25).map(d=>d.dow+(d.est?'~':''));
    if(tailRain>=0.6&&rainDays.length){
      let s='Further out: forecast already carries ~'+fmtIn(tailRain)+' ('+rainDays.join('/')+') — that IS the rain signal; plan around it.';
      if(outlook&&outlook.p814txt) s+=' Days 8–14 beyond that: '+outlook.p814txt;
      return s;
    }
    if(tailRain>=0.25&&outlook) return (outlook.text||'').replace('Further out: ','Further out: ~'+fmtIn(tailRain)+' already in the tail days; ');
    return outlook?outlook.text:null;
  }catch(e){ return outlook?outlook.text:null; }
}
// observed rainfall (Iowa Environmental Mesonet reanalysis — free)
async function fetchPastRain(lat,lng,daysBack){
  try{
    const end=new Date(), start=new Date(end.getTime()-daysBack*86400e3);
    const f=d=>d.toISOString().slice(0,10);
    const r=await fetch('https://mesonet.agron.iastate.edu/iemre/multiday/'+f(start)+'/'+f(end)+'/'+lat.toFixed(2)+'/'+lng.toFixed(2)+'/json');
    const j=await r.json();
    const arr=(j.data||[]).map(d=>{
      let v=null;
      for(const k of Object.keys(d)) if(/precip/i.test(k)&&typeof d[k]==='number'){ v=d[k]; break; }
      return {date:d.date||d.valid,in:Math.max(0,v||0)};
    }).filter(x=>x.in!=null);
    const last3=arr.slice(-3).reduce((t,x)=>t+x.in,0);
    const sincePrep=arr.reduce((t,x)=>t+x.in,0);
    return {daily:arr.slice(-4),last3,sincePrep};
  }catch(e){ return null; }
}

async function getJSON(url){

}

// ---- Rainfall (QPF) helpers: NWS grid data gives precip amounts in mm over time spans ----
function durHours(iso){ // "PT6H", "P1D", "P1DT6H", "PT30M"
  const m=/P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(iso||'');
  if(!m) return 1;
  return (+(m[1]||0))*24 + (+(m[2]||0)) + (+(m[3]||0))/60 || 1;
}
function buildQpf(grid){ // -> array of {start:Date, hours, inches}
  const vals=grid&&grid.properties&&grid.properties.quantitativePrecipitation&&grid.properties.quantitativePrecipitation.values||[];
  return vals.map(v=>{
    const [startIso,dur]=v.validTime.split('/');
    return {start:new Date(startIso), hours:durHours(dur), inches:(v.value||0)/25.4};
  });
}
function qpfBetween(qpf,from,to){ // total inches overlapping [from,to)
  let tot=0;
  for(const q of qpf){
    const qEnd=new Date(q.start.getTime()+q.hours*3600e3);
    const a=Math.max(from,q.start), b=Math.min(to,qEnd);
    if(b>a) tot+=q.inches*((b-a)/(q.hours*3600e3));
  }
  return tot;
}
function fmtIn(x){ return x>=0.995?x.toFixed(1)+'"' : x>=0.005?x.toFixed(2).replace(/^0/,'')+'"' : '0"'; }

function render(el,daily,hourly,alerts,pointProps,grid,cust,pastRain,outlook,ext,om){
  const hrs=(hourly.properties.periods||[]).slice(0,12);
  const days=(daily.properties.periods||[]).slice(0,10);
  const now=hrs[0];
  const qpf=buildQpf(grid);
  const hasQpf=qpf.length>0;
  let html='';

  // ===== Scheduling Call (the smart summary) =====
  if(cust&&hourly&&hourly.properties&&grid){
    try{
      const a=analyzeWx(cust,daily,hourly,grid,pastRain,ext,om);
      html+=`<div class="sect schedcall"><h3>Scheduling Outlook</h3>
        <div class="sc-chip ${a.cls}">${esc(a.chip)}</div>
        <div class="sc-pre">${esc(a.prefix)}</div>
        <div class="sc-text">${esc(a.text||'')}</div>
        ${a.ctx?`<div class="sc-ctx">${esc(a.ctx)}</div>`:''}
        ${(()=>{const fo=composeFurtherOut(a,outlook);return fo?`<div class="sc-out">${esc(fo)}</div>`:''})()}
      </div>`;
    }catch(e){ console.warn('schedcall',e); }
  }

  if(now){
    const feels=feelsLike(grid,now);
    html+=`<div class="sect"><h3>Right now</h3>
      <div class="now">
        <div class="temp">${now.temperature}°</div>
        <div><div class="cond">${esc(now.shortForecast)}</div>
        ${feels!==null?`<div class="feels${feels<=32?' cold':''}">Feels like ${feels}°</div>`:''}
        <div class="wind">Wind ${esc(now.windSpeed)} ${esc(now.windDirection||'')}</div></div>
      </div>`;
    // Pour check: scan next 48 hrs for freeze risk (actual temp + wind chill)
    const scan=(hourly.properties.periods||[]).slice(0,48);
    if(scan.length){
      let minT=Infinity, minFeels=Infinity, when=null;
      scan.forEach(p=>{
        const t=p.temperature, v=parseWind(p.windSpeed);
        const wc=(t<=50&&v>=3)?Math.round(35.74+0.6215*t-35.75*Math.pow(v,0.16)+0.4275*t*Math.pow(v,0.16)):t;
        if(t<minT){minT=t; when=p.startTime;}
        if(wc<minFeels) minFeels=wc;
      });
      const whenStr=when?new Date(when).toLocaleString([],{weekday:'short',hour:'numeric'}):'';
      if(minT<=32){
        html+=`<div class="pour cold">❄ FREEZE RISK — 48-hr low ${minT}° (feels ${minFeels}°) ${whenStr}. No pour.</div>`;
      }else if(minT<=38){
        html+=`<div class="pour warn">⚠ Cold pour caution — 48-hr low ${minT}° (feels ${minFeels}°) ${whenStr}</div>`;
      }else{
        html+=`<div class="pour ok">✓ Pour OK — 48-hr low ${minT}°</div>`;
      }
    }
    if(hasQpf){
      const t0=new Date();
      const covEnd=qpf.reduce((m,q)=>Math.max(m,q.start.getTime()+q.hours*3600e3),0);
      const covDays=Math.max(1,Math.min(7,Math.floor((covEnd-t0)/86400000)));
      const r24=qpfBetween(qpf,t0,new Date(t0.getTime()+24*3600e3));
      const rCov=qpfBetween(qpf,t0,new Date(t0.getTime()+covDays*24*3600e3));
      html+=`<div class="totals"><span><b>${fmtIn(r24)}</b> next 24 hrs</span><span><b>${fmtIn(rCov)}</b> next ${covDays} day${covDays===1?'':'s'}</span></div>`;
    }
    const feats=alerts&&alerts.features?alerts.features:[];
    feats.slice(0,2).forEach(a=>{ html+=`<div class="alert">⚠ ${esc(a.properties.event)}</div>`; });
    html+=`</div>`;
  }

  if(hasQpf||hrs.length){
    WX={qpf,hasQpf,periods:(hourly.properties.periods||[])};
    html+=`<div class="sect"><h3>Precipitation</h3><div class="daysel" id="daySel"></div><div id="pDayBody"></div></div>`;
  }

  if(hrs.length){
    html+=`<div class="sect"><h3>Next 12 hours</h3><div class="hourly">`;
    hrs.forEach(h=>{
      const st=new Date(h.startTime);
      const t=st.toLocaleTimeString([],{hour:'numeric'});
      const pr=h.probabilityOfPrecipitation&&h.probabilityOfPrecipitation.value;
      let rainRow='';
      if(hasQpf){
        const amt=qpfBetween(qpf,st,new Date(st.getTime()+3600e3));

      }
      html+=`<div class="hr"><div class="t">${t}</div><img src="${h.icon}" alt=""><div class="v">${h.temperature}°</div><div class="p">${pr?pr+'%':'—'}</div>${rainRow}</div>`;
    });

  }

  if(days.length){
    html+=`<div class="sect"><h3>Forecast</h3>`;
    days.forEach(d=>{
      const pr=d.probabilityOfPrecipitation&&d.probabilityOfPrecipitation.value;
      let amtStr='';
      if(hasQpf){
        const amt=qpfBetween(qpf,new Date(d.startTime),new Date(d.endTime));
        if(amt>=0.005) amtStr=`<span class="amt">${fmtIn(amt)}</span>`;
      }
      html+=`<div class="day">
        <div class="dn">${esc(shortName(d.name))}</div>
        <img src="${d.icon}" alt="">
        <div class="dd">${esc(d.shortForecast)}</div>
        <div class="rain">${pr?pr+'%':''}${amtStr}</div>
        <div class="dt">${d.temperature}°</div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`<div class="src">Source: <a href="https://forecast.weather.gov/MapClick.php?lat=${daily.geometry?'' : ''}${pointProps.relativeLocation?pointProps.relativeLocation.geometry.coordinates[1]:''}&lon=${pointProps.relativeLocation?pointProps.relativeLocation.geometry.coordinates[0]:''}" target="_blank" rel="noopener">National Weather Service ↗</a>${ext&&ext.length?' · extended days: MET Norway':''}</div>`;
  el.innerHTML=html;
  if(WX) buildDaySel();
}

// ===== Apple-style precipitation day view =====
let WX=null, WXsel=0;
function buildDaySel(){
  const sel=document.getElementById('daySel');
  if(!sel||!WX) return;
  // group hourly periods by the forecast site's local date (from the ISO string itself)
  const dayKeys=[], byDay={};
  WX.periods.forEach(p=>{
    const k=p.startTime.slice(0,10);
    if(!byDay[k]){ byDay[k]=[]; dayKeys.push(k); }
    byDay[k].push(p);
  });
  WX.dayKeys=dayKeys.slice(0,7); WX.byDay=byDay; WXsel=0;
  sel.innerHTML=WX.dayKeys.map((k,i)=>{
    const d=new Date(k+'T12:00:00');
    return `<button class="dchip${i===0?' sel':''}" data-i="${i}">
      <span class="dw">${'SMTWTFS'[d.getDay()]}</span><span class="dd2">${d.getDate()}</span></button>`;
  }).join('');
  sel.querySelectorAll('.dchip').forEach(b=>b.onclick=()=>{
    WXsel=+b.dataset.i;
    sel.querySelectorAll('.dchip').forEach(x=>x.classList.toggle('sel',x===b));
    renderPrecipDay();
  });
  renderPrecipDay();
}
function renderPrecipDay(){
  const body=document.getElementById('pDayBody');
  if(!body||!WX) return;
  const key=WX.dayKeys[WXsel], pds=WX.byDay[key]||[];
  const dayStart=new Date(pds[0]?pds[0].startTime.slice(0,19)+pds[0].startTime.slice(19):key+'T00:00:00');
  // hourly slots for this site-local day
  const slots=[];
  pds.forEach(p=>{
    const a=new Date(p.startTime), b=new Date(p.endTime);
    slots.push({hr:+p.startTime.slice(11,13), pop:(p.probabilityOfPrecipitation&&p.probabilityOfPrecipitation.value)||0,
      amt:WX.hasQpf?qpfBetween(WX.qpf,a,b):0, covered:WX.hasQpf&&qpfCovers(WX.qpf,a)});
  });
  const covered=slots.some(s=>s.covered);
  const total=slots.reduce((t,s)=>t+s.amt,0);
  const maxPop=Math.max(0,...slots.map(s=>s.pop));
  const dLabel=new Date(key+'T12:00:00').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});

  // intensity bands (in/hr): Light <0.1, Moderate 0.1–0.3, Heavy >0.3 — piecewise scale like Apple's
  const H=84, band=H/3;
  const yFor=a=>{
    let f;
    if(a<=0.1) f=(a/0.1)/3;
    else if(a<=0.3) f=1/3+((a-0.1)/0.2)/3;
    else f=Math.min(1, 2/3+((a-0.3)/0.3)/3);
    return Math.max(a>0.003?3:0, Math.round(f*H));
  };
  let bars='';
  for(let h=0;h<24;h++){
    const s=slots.find(x=>x.hr===h);
    const hpx=s?yFor(s.amt):0;
    bars+=`<div class="ibar" style="height:${Math.max(hpx,1)}px" title="${h%12||12}${h<12?'am':'pm'} — ${s?fmtIn(s.amt):'–'}"></div>`;
  }
  let html=`<div class="pdate">${dLabel}</div>`;
  if(covered){
    html+=`<div class="ptotal"><b>${fmtIn(total)}</b><span>Total for the day</span></div>
    <div class="ichart">
      <div class="iband" style="bottom:${band*2}px"><i>Heavy</i></div>
      <div class="iband" style="bottom:${band}px"><i>Moderate</i></div>
      <div class="iband" style="bottom:0"><i>Light</i></div>
      <div class="ibars">${bars}</div>
    </div>
    <div class="iaxis"><span>12AM</span><span>6AM</span><span>12PM</span><span>6PM</span></div>`;
  }else{
    html+=`<div class="pnone">Rain amounts for this day aren't published yet — chance of rain below.</div>`;
  }
  // chance-of-precip curve
  if(slots.length){
    const pts=slots.map(s=>`${(s.hr/23*236+2).toFixed(1)},${(66-s.pop/100*60).toFixed(1)}`);
    const area=`2,66 ${pts.join(' ')} 238,66`;
    html+=`<div class="pchance"><div class="pctitle">Chance of Precipitation<span>${dLabel.split(',')[0]}'s chance: ${maxPop}%</span></div>
      <div class="pcwrap"><svg viewBox="0 0 240 70" preserveAspectRatio="none">
        <polygon points="${area}" fill="rgba(90,169,245,.22)"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="#5aa9f5" stroke-width="2"/>
      </svg><div class="pcax"><span>100%</span><span>50%</span><span>0%</span></div></div>
      <div class="iaxis"><span>12AM</span><span>6AM</span><span>12PM</span><span>6PM</span></div></div>`;
  }
  body.innerHTML=html;
}
function qpfCovers(qpf,t){
  return qpf.some(q=>t>=q.start && t<new Date(q.start.getTime()+q.hours*3600e3));
}
function parseWind(s){ // "10 mph" or "5 to 15 mph" -> mph number (upper end)
  const m=String(s||'').match(/(\d+)(?:\s*to\s*(\d+))?/);
  return m?+(m[2]||m[1]):0;
}
function feelsLike(grid,nowPeriod){
  // prefer NWS apparent temperature at the current hour; fall back to wind-chill formula
  try{
    const vals=grid&&grid.properties&&grid.properties.apparentTemperature&&grid.properties.apparentTemperature.values||[];
    const t=new Date();
    for(const v of vals){
      const [iso,dur]=v.validTime.split('/');
      const a=new Date(iso), b=new Date(a.getTime()+durHours(dur)*3600e3);
      if(t>=a&&t<b&&v.value!==null) return Math.round(v.value*9/5+32);
    }
  }catch(e){}
  if(nowPeriod){
    const t=nowPeriod.temperature, v=parseWind(nowPeriod.windSpeed);
    if(t<=50&&v>=3) return Math.round(35.74+0.6215*t-35.75*Math.pow(v,0.16)+0.4275*t*Math.pow(v,0.16));
    return t;
  }
  return null;
}

function shortName(n){
  return n.replace('This Afternoon','Today').replace('Afternoon','Aft').replace('Night',' PM').replace('day ',' ').slice(0,9);
}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function lum(hex){
  const n=parseInt(hex.slice(1),16);
  return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;
}
